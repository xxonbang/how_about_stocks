<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>*{margin:0;padding:0}body{background:transparent}</style></head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
async function draw() {
  // Load Pretendard ExtraBold
  const font = new FontFace('Pretendard', 'url(./Pretendard-ExtraBold.woff2)', {
    weight: '800',
    style: 'normal',
  });
  await font.load();
  document.fonts.add(font);

  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const W = 512;

  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }

  rr(0,0,W,W,96);
  ctx.save();
  ctx.clip();

  // ===== BACKGROUND =====
  const bg = ctx.createLinearGradient(0, W, W, 0);
  bg.addColorStop(0, '#060D1F');
  bg.addColorStop(0.3, '#0C1A3D');
  bg.addColorStop(0.6, '#1E3A8A');
  bg.addColorStop(1, '#2563EB');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,W);

  // Subtle radial glow
  const rd = ctx.createRadialGradient(W*0.5, W*0.48, 0, W*0.5, W*0.48, W*0.55);
  rd.addColorStop(0, 'rgba(59,130,246,0.10)');
  rd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rd;
  ctx.fillRect(0,0,W,W);

  // ===== TEXT =====
  const fontSize = 168;
  ctx.font = `800 ${fontSize}px Pretendard`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const line1 = '종목';
  const line2 = '어때';
  const lineGap = 20;
  const totalH = fontSize * 2 + lineGap;
  const startY = (W - totalH) / 2 + fontSize / 2;

  // Text shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillText(line1, W/2 + 2, startY + 3);
  ctx.fillText(line2, W/2 + 2, startY + fontSize + lineGap + 3);

  // Main text
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(line1, W/2, startY);
  ctx.fillText(line2, W/2, startY + fontSize + lineGap);

  // ===== OUTER BORDER =====
  rr(0,0,W,W,96);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
  document.title = 'DONE';
}

draw().catch(e => { console.error(e); document.title = 'DONE'; });
</script>
</body>
</html>
