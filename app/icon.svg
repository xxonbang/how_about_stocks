<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/packages/pretendard/dist/web/static/pretendard.min.css');
    </style>
    <clipPath id="clip"><rect width="512" height="512" rx="96"/></clipPath>
    <linearGradient id="bg" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060D1F"/>
      <stop offset="30%" stop-color="#0C1A3D"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Text shadow -->
    <text x="258" y="203" font-family="Pretendard, -apple-system, sans-serif" font-weight="800" font-size="168" fill="rgba(0,0,0,0.25)" text-anchor="middle" dominant-baseline="middle">종목</text>
    <text x="258" y="391" font-family="Pretendard, -apple-system, sans-serif" font-weight="800" font-size="168" fill="rgba(0,0,0,0.25)" text-anchor="middle" dominant-baseline="middle">어때</text>

    <!-- Main text -->
    <text x="256" y="200" font-family="Pretendard, -apple-system, sans-serif" font-weight="800" font-size="168" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">종목</text>
    <text x="256" y="388" font-family="Pretendard, -apple-system, sans-serif" font-weight="800" font-size="168" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">어때</text>
  </g>

  <rect width="512" height="512" rx="96" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
