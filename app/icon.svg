<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip"><rect width="512" height="512" rx="96"/></clipPath>

    <radialGradient id="bg" cx="48%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#1C4542"/>
      <stop offset="100%" stop-color="#081B1A"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="metal" x1="120" y1="70" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4D8BC"/>
      <stop offset="18%" stop-color="#E4C098"/>
      <stop offset="45%" stop-color="#C89874"/>
      <stop offset="72%" stop-color="#B68462"/>
      <stop offset="100%" stop-color="#9E704C"/>
    </linearGradient>
    <linearGradient id="metalHi" x1="120" y1="70" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCECDC"/>
      <stop offset="100%" stop-color="#E2C4A2"/>
    </linearGradient>
    <linearGradient id="metalDk" x1="120" y1="70" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#886040"/>
      <stop offset="100%" stop-color="#4E3018"/>
    </linearGradient>

    <linearGradient id="orb" x1="100" y1="110" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AE8C"/>
      <stop offset="30%" stop-color="#A07858"/>
      <stop offset="60%" stop-color="#BA9474"/>
      <stop offset="100%" stop-color="#CCAA88"/>
    </linearGradient>

    <filter id="ds" x="-10%" y="-6%" width="125%" height="125%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="4" flood-color="#040C0C" flood-opacity="0.5"/>
    </filter>
    <filter id="dsHeavy" x="-10%" y="-6%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#040C0C" flood-opacity="0.55"/>
    </filter>

    <path id="orbitArc" d="M 360,138 A 160,160 0 1 0 388,256"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#vig)"/>
    <rect x="3" y="3" width="506" height="506" rx="94" fill="none" stroke="#2A5E5A" stroke-width="1" opacity="0.3"/>

    <!-- ===== ORBIT ===== -->
    <use href="#orbitArc" fill="none" stroke="#030A0A" stroke-width="17" stroke-linecap="round" opacity="0.2" transform="translate(1.5,3)"/>
    <use href="#orbitArc" fill="none" stroke="#3E2A18" stroke-width="15" stroke-linecap="round" opacity="0.22"/>
    <use href="#orbitArc" fill="none" stroke="url(#orb)" stroke-width="12.5" stroke-linecap="round"/>
    <use href="#orbitArc" fill="none" stroke="url(#metalHi)" stroke-width="2.5" stroke-linecap="round" opacity="0.16" transform="translate(-0.5,-0.8)"/>

    <!-- ===== BRAIN ===== -->
    <g filter="url(#ds)">
      <!-- Outline layer -->
      <g stroke="#0E2622" stroke-width="2.8" fill="none" opacity="0.28">
        <ellipse cx="218" cy="222" rx="74" ry="56"/>
        <ellipse cx="172" cy="176" rx="44" ry="40"/>
        <ellipse cx="220" cy="154" rx="40" ry="48"/>
        <ellipse cx="270" cy="178" rx="42" ry="38"/>
        <ellipse cx="190" cy="268" rx="34" ry="22"/>
        <ellipse cx="250" cy="268" rx="34" ry="22"/>
      </g>
      <!-- Fill layer -->
      <g fill="url(#metal)">
        <ellipse cx="218" cy="222" rx="74" ry="56"/>
        <ellipse cx="172" cy="176" rx="44" ry="40"/>
        <ellipse cx="220" cy="154" rx="40" ry="48"/>
        <ellipse cx="270" cy="178" rx="42" ry="38"/>
        <ellipse cx="190" cy="268" rx="34" ry="22"/>
        <ellipse cx="250" cy="268" rx="34" ry="22"/>
      </g>
      <!-- Top highlight along lobes -->
      <path d="M 134,186 Q 160,140 196,144 Q 214,112 240,144 Q 258,144 286,156 Q 308,168 312,192"
        fill="none" stroke="url(#metalHi)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <!-- Hemisphere line -->
      <line x1="218" y1="116" x2="216" y2="286" stroke="#0E2622" stroke-width="1.8" opacity="0.2"/>
      <!-- Subtle inner fold curves -->
      <path d="M 152,208 Q 166,196 180,206" fill="none" stroke="#0E2622" stroke-width="1.2" opacity="0.13" stroke-linecap="round"/>
      <path d="M 256,206 Q 246,194 236,204" fill="none" stroke="#0E2622" stroke-width="1.2" opacity="0.13" stroke-linecap="round"/>
    </g>

    <!-- ===== GROWTH ARROW ===== -->
    <g filter="url(#dsHeavy)">
      <polyline points="130,384 220,268 264,298 374,158"
        fill="none" stroke="#180C02" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
      <polyline points="130,384 220,268 264,298 374,158"
        fill="none" stroke="url(#metal)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="133,380 221,266 264,294 373,156"
        fill="none" stroke="url(#metalHi)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

      <!-- Arrowhead -->
      <path d="M 384,138 L 400,182 L 360,194 Z" fill="url(#metal)" stroke="url(#metalDk)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 386,146 L 396,176" fill="none" stroke="url(#metalHi)" stroke-width="2.5" opacity="0.28" stroke-linecap="round"/>
    </g>
  </g>

  <rect width="512" height="512" rx="96" fill="none" stroke="#000" stroke-width="1" opacity="0.1"/>
</svg>
